version: '3.8'

services:
  # ============================================================================
  # 1. Database Service: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school_management}
      POSTGRES_USER: ${DB_USER:-school_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-school_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-school_admin} -d ${DB_NAME:-school_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # ============================================================================
  # 2. Application Service: Node.js API Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      LOG_LEVEL: info
      TRUST_PROXY: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-school_management}
      DB_USER: ${DB_USER:-school_admin}
      DB_PASSWORD: ${DB_PASSWORD:-school_secure_pass_2026}
      DATABASE_URL: postgresql://${DB_USER:-school_admin}:${DB_PASSWORD:-school_secure_pass_2026}@postgres:5432/${DB_NAME:-school_management}
      DB_IN_MEMORY: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # ============================================================================
  # 3. Ingress Reverse Proxy: Nginx with TLS Termination & Rate Limiting
  # ============================================================================
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: school-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# ==============================================================================
# Isolated Networks (Least Privilege & Defense-in-Depth)
# ==============================================================================
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    # Database is isolated on backend-net and cannot be directly probed from host

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local

